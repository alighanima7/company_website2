<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0F6F4" />
    <script>
      /* Theme bootstrap — same contract as production: LIGHT is the CSS base
         and the default; DARK is stamped pre-paint only for a returning
         explicit choice (localStorage, cookie fallback). Zero flash. */
      (function () {
        try {
          var t = localStorage.getItem("nns.theme.v2");
          if (t !== "dark" && t !== "light") {
            var m = document.cookie.match(/(?:^|;\s*)nns-v2-theme=(dark|light)/);
            t = m ? m[1] : null;
          }
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#0B1619");
          }
          /* Locale: ARABIC (rtl) is the default; a stored English choice
             flips lang/dir pre-paint so there is no direction flash. */
          var l = localStorage.getItem("nns.locale.v2");
          if (l !== "ar" && l !== "en") {
            var lm = document.cookie.match(/(?:^|;\s*)nns-v2-locale=(ar|en)/);
            l = lm ? lm[1] : null;
          }
          if (l === "en") {
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
          }
        } catch (e) {}
      })();
    </script>
    <!-- Default-locale (Arabic) metadata. App.tsx re-stamps document.title
         per route and locale after hydration; this pair is what crawlers and
         the first paint see. -->
    <meta
      name="description"
      content="حلول احترافية لإدارة الأساطيل وتتبع المركبات والكاميرات الذكية وإنترنت الأشياء — تماشيًا مع رؤية المملكة 2030."
    />
    <title>النخلة الأهلية الأمنية — إدارة الأساطيل وتتبع المركبات</title>

    <!-- Every route is a hash fragment, so the canonical URL is the origin
         root. __SITE_ORIGIN__ is substituted by vite.config.ts. -->
    <link rel="canonical" href="__SITE_ORIGIN__/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social cards. Crawlers require ABSOLUTE urls for og:url / og:image /
         twitter:image — __SITE_ORIGIN__ comes from the single SITE_ORIGIN
         constant in vite.config.ts, so the custom domain is a one-line
         change there (never edit these by hand). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="النخلة الأمنية — ALNAKHLAH SECURITY" />
    <meta property="og:title" content="النخلة الأهلية الأمنية — تحكم في كل حركة" />
    <meta
      property="og:description"
      content="حلول احترافية لإدارة الأساطيل وتتبع المركبات والكاميرات الذكية وإنترنت الأشياء — تماشيًا مع رؤية المملكة 2030."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:image" content="__SITE_ORIGIN__/og.jpg" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og.jpg" />
    <!-- Self-hosted IBM Plex (woff2, subset per script) — @font-face lives
         in styles.css. Preload only the default locale's critical pair;
         Latin/mono and the 600s arrive on demand via unicode-range. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
