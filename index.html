<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3c3c8" />
    <script>
      /* Theme bootstrap — same contract as production: LIGHT is the CSS base
         and the default; DARK is stamped pre-paint only for a returning
         explicit choice (localStorage, cookie fallback). Zero flash. */
      (function () {
        try {
          var t = localStorage.getItem("nns.theme.v2");
          if (t !== "dark" && t !== "light") {
            var m = document.cookie.match(/(?:^|;\s*)nns-v2-theme=(dark|light)/);
            t = m ? m[1] : null;
          }
          if (t === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#1e1a17");
          }
          /* Locale: ARABIC (rtl) is the default; a stored English choice
             flips lang/dir pre-paint so there is no direction flash. */
          var l = localStorage.getItem("nns.locale.v2");
          if (l !== "ar" && l !== "en") {
            var lm = document.cookie.match(/(?:^|;\s*)nns-v2-locale=(ar|en)/);
            l = lm ? lm[1] : null;
          }
          if (l === "en") {
            document.documentElement.lang = "en";
            document.documentElement.dir = "ltr";
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="النخلة الأهلية الأمنية — تجربة تفاعلية ثلاثية الأبعاد (نسخة تجريبية v2) لحلول تتبع المركبات وإدارة الأساطيل وإنترنت الأشياء."
    />
    <title>النخلة الأمنية — NNS v2</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social cards. og:image is site-relative: swap in the absolute
         production URL (crawlers require it) once the domain is final. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="النخلة الأمنية — ALNAKHLAH SECURITY" />
    <meta property="og:title" content="النخلة الأمنية — تجربة ثلاثية الأبعاد" />
    <meta
      property="og:description"
      content="حلول احترافية لإدارة الأساطيل وتتبع المركبات والكاميرات الذكية وإنترنت الأشياء — تماشيًا مع رؤية المملكة 2030."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
